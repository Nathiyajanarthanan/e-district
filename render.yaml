services:
  # 1. Backend Web Service (Flask)
  - type: web
    name: e-district-server
    env: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-district-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: e-district-client
          property: url

  # 2. Frontend Web Service (Node.js)
  # Using type: web instead of static to bypass the "unknown type static" error.
  # This serves the static files using the 'serve' package.
  - type: web
    name: e-district-client
    env: node
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        fromService:
          name: e-district-server
          property: url
        suffix: /api

# 3. PostgreSQL Database
databases:
  - name: e-district-db
    region: singapore
    plan: free
