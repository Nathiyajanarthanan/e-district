services:
  # 1. Backend Web Service (Flask)
  - type: web
    name: e-district-server
    env: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: e-district-db
          property: connectionString
      - key: SECRET_KEY
        value: super-secret-key-for-production-123
      - key: FRONTEND_URL
        value: https://e-district-client.onrender.com

  # 2. Frontend Web Service (Node.js)
  - type: web
    name: e-district-client
    env: node
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: https://e-district-server.onrender.com/api

# 3. PostgreSQL Database
databases:
  - name: e-district-db
    region: singapore
    plan: free
