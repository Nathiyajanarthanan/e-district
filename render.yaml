services:
  # 1. Backend Web Service (Flask)
  - type: web
    name: e-district-server
    env: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-district-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: e-district-client
          type: web # Changed to web for property mapping
          property: url

  # 2. Frontend Static Site (Vite)
  # Changed type to web with env: static as some Blueprint parsers prefer this
  - type: web
    name: e-district-client
    env: static
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: e-district-server
          type: web
          property: url
        suffix: /api

# 3. PostgreSQL Database
databases:
  - name: e-district-db
    region: singapore
    plan: free
